# ================================================================
# Dataset config — Amazon_Books
# Users: 139K  |  Items: 113K  |  Ratings: 3.34M  |  Sparsity: 99.97%
# ================================================================
#
# RAGIONAMENTO SUI PARAMETRI
# --------------------------
# MAX_ITEM_LIST_LENGTH = 20
#   Con 3.34M ratings su 139K utenti → media ~24 interazioni/utente.
#   Ma la sparsità è 99.97% (la più alta): la distribuzione è molto
#   long-tail, molti utenti hanno pochissime interazioni.
#   20 è conservativo per non gonfiare il padding su code corte,
#   e allineato con la letteratura su Amazon Books (es. BERT4Rec paper).
#
# min_user_inter_num = 5
#   Sparsità altissima: abbassare la soglia per non perdere troppi
#   utenti (già pochi con storie lunghe). Standard 5-core filtering.
#
# min_item_inter_num = 5
#   113K item ma sparsità elevatissima: 5-core per bilanciare coverage
#   e qualità delle embedding.
#
# train_batch_size = 2048
#   Dataset molto grande ma sparso: batch medio per evitare
#   instabilità su embedding con pochi esempi per item.
#
# epochs = 300
#   Dataset sparso converge lentamente (segnale debole per item rari).
#   300 epoche con early stopping a 20 dà tempo sufficiente.
# ================================================================

# ---------- campi ----------
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

field_separator: "\t"  # preprocess.py converte a TAB
seq_separator: " "

load_col:
  inter: [user_id, item_id, timestamp]



# ---------- sequenza ----------
MAX_ITEM_LIST_LENGTH: 20

# ---------- split ----------
# benchmark_filename passato via parameter_dict in run_experiments.py
# RecBole cerca: <tag>.train.inter  <tag>.valid.inter  <tag>.test.inter

# ---------- training ----------
epochs: 300
train_batch_size: 4096
eval_batch_size: 4096
learner: adam
learning_rate: 0.001
stopping_step: 20

# ---------- negative sampling ----------
# CE loss gestisce il neg sampling internamente: deve essere None
train_neg_sample_args: ~

# ---------- evaluation ----------
metrics: ["Recall", "NDCG", "MRR", "Hit"]
topk: [10, 20, 50]
valid_metric: NDCG@10