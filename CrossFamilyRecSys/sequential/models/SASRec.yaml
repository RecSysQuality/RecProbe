# ================================================================
# SASRec — architettura
# Self-Attentive Sequential Recommendation
# Kang & McAuley, 2018
# ================================================================
#
# hidden_size = 64
#   Valore originale del paper SASRec. Con n_heads=2 ogni head
#   ha dim 32, sufficiente per catturare pattern locali.
#   La proiezione inner_size=256 (4×) amplifica prima di ridurre.
#
# n_heads = 2
#   Standard per dataset di medie dimensioni. Su cataloghi grandi
#   (Books: 113K item) considera 4 head se hai GPU con memoria.
#
# n_layers = 2
#   Due layer di self-attention: cattura dipendenze sia locali
#   che globali nella sequenza. Paper originale usa 2.
#
# hidden_dropout_prob = attn_dropout_prob = 0.5
#   Dropout aggressivo standard nel paper originale.
#   Su dataset piccolo (Toys: 43K utenti) può aiutare contro overfit.
#   Su Yelp/Books con molti dati considera di abbassare a 0.2.
#
# MAX_ITEM_LIST_LENGTH
#   Ereditato dal dataset config (20 o 50 a seconda del dataset).
#
# loss_type = CE
#   Come GRU4Rec: cross-entropy full softmax.
# ================================================================

model: SASRec
epochs: 200
hidden_size: 64
inner_size: 256
n_heads: 2
n_layers: 2
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE
