# ================================================================
# Dataset config — Amazon_Books  (LightGCN / NGCF / GCMC)
# Users: 139K  |  Items: 113K  |  Ratings: 3.34M  |  Sparsity: 99.97%
# ================================================================
#
# DIFFERENZE RISPETTO AL CONFIG SEQUENZIALE
# ------------------------------------------
# Stesse differenze strutturali degli altri yaml CF:
# niente MAX_ITEM_LIST_LENGTH, split RS, metriche GCMC via override.
#
# RAGIONAMENTO SUI PARAMETRI
# --------------------------
# min_user_inter_num = 5
#   Sparsità altissima (99.97%): soglia bassa per non perdere
#   troppi utenti dal grafo. Con soglia 10 si perderebbero
#   molti utenti che hanno già pochissime interazioni.
#   Diverso da Yelp (soglia 10) perché Books è molto più sparso.
#
# min_item_inter_num = 5
#   113K item con sparsità altissima: 5-core mantiene più item
#   nel grafo. Item con < 5 interazioni non contribuiscono
#   significativamente alla propagazione.
#
# train_batch_size = 4096
#   Dataset grande (3.34M interazioni): batch grandi per efficienza.
#   Su Books sparso il campionamento BPR è più costoso perché
#   ci sono molti item rari da considerare come negativi.
#
# epochs = 300
#   Sparsità 99.97%: segnale debole per item rari, convergenza lenta.
#   300 epoche con early stopping a 20 valutazioni dà tempo sufficiente.
#   Override confermato in MODEL_HPARAMS_CF di run_cf.py.
#
# eval_step = stopping_step = 20
#   Valuta ogni 20 epoche; early stopping dopo 20 valutazioni
#   senza miglioramento (= 400 epoche di pazienza massima).
#   Con epochs=300 e eval_step=20 si hanno al massimo 15 valutazioni
#   prima del termine → stopping_step=20 non scatta mai prima della fine
#   a meno di plateau reale.
# ================================================================

# ---------- campi ----------
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

field_separator: "\t"
seq_separator: " "

load_col:
  inter: [user_id, item_id,rating, timestamp]



# ---------- training ----------
epochs: 300
train_batch_size: 4096
eval_batch_size: 4096
learner: adam
learning_rate: 0.001
eval_step: 20
stopping_step: 20

# ---------- negative sampling ----------
train_neg_sample_args: ~

# ---------- evaluation ----------
metrics: ["Recall", "NDCG", "MRR", "Hit"]
topk: [10, 20, 50]
valid_metric: NDCG@10