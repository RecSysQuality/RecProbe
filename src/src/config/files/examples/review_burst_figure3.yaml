# (3) Defect injection: review burst - Figure 3, central panel
budget: 0.3
review_burst:
  target: item
  selection_strategy: top
  max_reviews_per_node: 50
  min_reviews_per_node: 1
  min_length_of_review: 10
  max_length_of_review: 100
  rating_behavior:
    min_rating: 1
    max_rating: 2
    sampling_strategy: uniform
  temporal_behavior:
    start_timestamp: 2018-01-01
    end_timestamp: 2023-01-01
    window:
      days: 0
      hours: 10
      minutes: 0
  fake_users:
    use_fake_users: true
    fake_behavior: mimic
  llm_configuration:
    backend: vllm
    huggingface_token: "*****"
    model: meta-llama/Meta-Llama-3.1-8B-Instruct
    temperature: 0.9
    prompt: Write a very short, generic negative review.
